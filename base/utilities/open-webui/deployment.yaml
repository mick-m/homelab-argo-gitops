apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: utilities
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: homelab
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main@sha256:d6c085678f7e3f474aa2a92ac9831cb68759dcfd951de250ebbb37dac5cd0255
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Dublin
            # Models are served by LM Studio on Mick's MacBook Pro 14" M1 Max
            # (OpenAI-compatible API, port 1234, "Serve on Local Network" on),
            # reached over Tailscale because Internal -> Trusted is blocked on the
            # LAN. The key is a placeholder; LM Studio doesn't check it. These are
            # PersistentConfig: once Admin > Settings > Connections has been saved,
            # the values stored in Open WebUI's DB win over these.
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: http://100.80.57.84:1234/v1
            - name: OPENAI_API_KEY
              value: lm-studio
            - name: WEBUI_AUTH
              value: "false"
            # Web search + page fetching through the in-cluster Firecrawl
            # (base/utilities/firecrawl, no auth, so no API key). Open WebUI
            # appends /v2/search and /v2/scrape. These are PersistentConfig:
            # they only apply while Admin > Settings > Web Search has never
            # been saved; after that the values stored in its DB win.
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: firecrawl
            - name: WEB_LOADER_ENGINE
              value: firecrawl
            - name: FIRECRAWL_API_BASE_URL
              value: http://firecrawl-api.utilities.svc:3002
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
