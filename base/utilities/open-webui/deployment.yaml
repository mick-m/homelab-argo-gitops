apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: utilities
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: homelab
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Dublin
            - name: OLLAMA_BASE_URL
              value: http://100.64.155.43:11434
            - name: WEBUI_AUTH
              value: "false"
            # Web search + page fetching through the in-cluster Firecrawl
            # (base/utilities/firecrawl, no auth, so no API key). Open WebUI
            # appends /v2/search and /v2/scrape. These are PersistentConfig:
            # they only apply while Admin > Settings > Web Search has never
            # been saved; after that the values stored in its DB win.
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: firecrawl
            - name: WEB_LOADER_ENGINE
              value: firecrawl
            - name: FIRECRAWL_API_BASE_URL
              value: http://firecrawl-api.utilities.svc:3002
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
