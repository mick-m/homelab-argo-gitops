apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Deployment mounts these two files with subPath, and Kubernetes never
# propagates ConfigMap updates into a subPath mount. Generating the ConfigMap
# gives it a content-hash name suffix, so editing a file below changes the
# ConfigMap name, which changes the Deployment's volume reference, which rolls
# the pod. Edits therefore reach the dashboard without a manual restart.
#
# Do not set disableNameSuffixHash — the hash is the whole mechanism.
namespace: utilities

configMapGenerator:
  - name: homepage-config
    files:
      - config/services.yaml
      - config/settings.yaml

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
