# Two worker roles, both from the same image as the API. `worker` drains the
# legacy queue; `nuq-worker` drains the Postgres-backed nuq queue. Upstream runs
# 5 nuq-worker replicas; 1 is plenty for homelab scrape volumes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-worker
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl-worker
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-worker
        app.kubernetes.io/part-of: homelab
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # Both workers exit the process on a failed Postgres connection, so
      # without this they crash-loop through every rollout until the queue DB
      # finishes initdb. Cheap to wait; noisy not to.
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - sh
            - -c
            - until nc -z firecrawl-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: worker
          image: ghcr.io/firecrawl/firecrawl:2.11.310
          command:
            - node
          args:
            - --max-old-space-size=1536
            - dist/src/services/queue-worker.js
          env:
            - name: FLY_PROCESS_GROUP
              value: worker
            - name: PORT
              value: "3005"
          envFrom:
            - configMapRef:
                name: firecrawl-config
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-nuq-worker
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl-nuq-worker
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-nuq-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-nuq-worker
        app.kubernetes.io/part-of: homelab
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - sh
            - -c
            - until nc -z firecrawl-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: nuq-worker
          image: ghcr.io/firecrawl/firecrawl:2.11.310
          command:
            - node
          args:
            - --max-old-space-size=1536
            - dist/src/services/worker/nuq-worker.js
          env:
            - name: FLY_PROCESS_GROUP
              value: nuq-worker
            - name: NUQ_WORKER_PORT
              value: "3006"
          envFrom:
            - configMapRef:
                name: firecrawl-config
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
