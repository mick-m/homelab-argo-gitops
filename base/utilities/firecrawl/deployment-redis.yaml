apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-redis
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl-redis
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-redis
        app.kubernetes.io/part-of: homelab
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --bind
            - 0.0.0.0
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
