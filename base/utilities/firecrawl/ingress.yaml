apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firecrawl
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/part-of: homelab
  annotations:
    cert-manager.io/cluster-issuer: stepca-acme
spec:
  ingressClassName: traefik
  rules:
    - host: firecrawl.sunnyside.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firecrawl-api
                port:
                  number: 3002
  tls:
    - hosts:
        - firecrawl.sunnyside.home
      secretName: firecrawl-tls
