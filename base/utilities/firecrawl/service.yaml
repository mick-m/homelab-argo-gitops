apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firecrawl-api
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      protocol: TCP
---
