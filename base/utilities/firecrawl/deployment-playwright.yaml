apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-playwright
  namespace: utilities
  labels:
    app.kubernetes.io/name: firecrawl-playwright
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-playwright
        app.kubernetes.io/part-of: homelab
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playwright
          image: ghcr.io/firecrawl/playwright-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: firecrawl-playwright-config
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /tmp/.cache
      volumes:
        # Chromium needs a writable cache dir; upstream mounts a 1G tmpfs here.
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
