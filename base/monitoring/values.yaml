# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack

alertmanager:
  enabled: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/pushover-credentials/{token,user-key}
    # SealedSecret: envs/prod/monitoring/sealed-secrets/pushover-credentials-sealed.yaml
    secrets:
      - pushover-credentials
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pushover
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      # Warnings re-notify twice a day while still firing
      repeat_interval: 12h
      routes:
        # Watchdog is an always-firing heartbeat; InfoInhibitor only suppresses info alerts
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: "null"
          matchers:
            - severity = "info"
        - receiver: pushover-critical
          matchers:
            - severity = "critical"
          group_wait: 10s
          repeat_interval: 1h
    inhibit_rules:
      # A critical alert silences the matching warning (e.g. disk 90% hides disk 80%)
      - source_matchers: [severity = "critical"]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = "warning"]
        target_matchers: [severity = "info"]
        equal: [namespace, alertname]
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]
    receivers:
      - name: "null"
      - name: pushover
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/pushover-credentials/token
            user_key_file: /etc/alertmanager/secrets/pushover-credentials/user-key
            priority: '{{ if eq .Status "firing" }}0{{ else }}-1{{ end }}'
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            message: '{{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Annotations.description }}{{ end }}{{ "\n" }}{{ end }}'
            url: https://grafana.sunnyside.home/alerting/list
            url_title: Open in Grafana
            send_resolved: true
      - name: pushover-critical
        pushover_configs:
          - token_file: /etc/alertmanager/secrets/pushover-credentials/token
            user_key_file: /etc/alertmanager/secrets/pushover-credentials/user-key
            # 1 = high priority: bypasses the user's Pushover quiet hours
            priority: '{{ if eq .Status "firing" }}1{{ else }}-1{{ end }}'
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            message: '{{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Annotations.description }}{{ end }}{{ "\n" }}{{ end }}'
            url: https://grafana.sunnyside.home/alerting/list
            url_title: Open in Grafana
            send_resolved: true

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
  initChownData:
    enabled: false
  securityContext:
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraInitContainers:
    - name: fix-datasource-uids
      image: busybox:latest
      command:
        - sh
        - -c
        - |
          cd /var/lib/grafana/dashboards/exporters
          for f in *.json; do
            sed -i 's/\${DS_PROMETHEUS}/prometheus/g' "$f"
            sed -i 's/\${DS_MIMIR}/prometheus/g' "$f"
          done
          sed -i 's/job=\\"node\\"/job=~\\".*node.*\\"/g' node-exporter-macos.json 2>/dev/null || true
      volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
  # Community Grafana dashboards for exporters
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: grafana-dashboards-exporters
          orgId: 1
          folder: Exporters
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/exporters
  dashboards:
    exporters:
      # UnPoller / UniFi dashboards
      unifi-client-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      unifi-network-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      unifi-usg-insights:
        gnetId: 11313
        revision: 9
        datasource: Prometheus
      unifi-usw-insights:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
      unifi-uap-insights:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      # Proxmox VE dashboard
      proxmox-ve:
        gnetId: 10347
        revision: 5
        datasource: Prometheus
      # Node Exporter Mac OSX dashboard
      node-exporter-macos:
        gnetId: 15797
        revision: 1
        datasource: Prometheus
      # TrueNAS dashboards
      truenas-overview:
        url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale.json
        datasource: Prometheus
      truenas-disk-insights:
        url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale_disk_insights.json
        datasource: Prometheus
      truenas-temperatures:
        url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale_temperatures.json
        datasource: Prometheus
      # Nextcloud dashboard
      nextcloud:
        gnetId: 9632
        revision: 1
        datasource: Prometheus

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

prometheus:
  prometheusSpec:
    # Allow Prometheus to discover all ServiceMonitors in the cluster,
    # not just those matching the Helm release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    # Same for PrometheusRules: load every rule in the cluster, not only those
    # labelled with this Helm release (cert-manager-alerts was never picked up).
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

# K3s runs the controller-manager, scheduler and proxy inside the k3s process
# and uses an embedded datastore, so these can't be scraped separately. Left
# enabled, their *Down alerts fire permanently (staging already disables them).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
