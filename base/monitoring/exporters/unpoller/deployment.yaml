apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: monitoring
  labels:
    app.kubernetes.io/name: unpoller
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
        app.kubernetes.io/part-of: homelab
    spec:
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.8.3
          ports:
            - name: metrics
              containerPort: 9130
              protocol: TCP
          env:
            - name: UP_PROMETHEUS_DISABLE
              value: "false"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: "0.0.0.0:9130"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            # UniFi controller credentials — sourced from Secret
            - name: UP_UNIFI_DEFAULT_URL
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: unifi-url
            - name: UP_UNIFI_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: unifi-user
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: unifi-pass
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "false"
          # unpoller's work is bursty: it polls the UniFi controller, does a short
          # burst of work, then idles. Measured over 7 days on prod it uses 2.4m
          # median / 2.9m p95 / 3.5m peak CPU — yet it was throttled 28% of its
          # CFS periods, because a 100m limit only grants 10ms of CPU per 100ms
          # period and a single poll wants more than that contiguously.
          #
          # So the old limit was never about capacity (it had 30x headroom on
          # average) — it was chopping up short bursts. The limit here is a
          # runaway guardrail, not a ration: 500m is ~140x measured peak usage
          # and costs nothing, since limits cap rather than reserve and the
          # request stays at 10m. Memory is untouched: peak working set is 22MB
          # against a 128Mi limit.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
