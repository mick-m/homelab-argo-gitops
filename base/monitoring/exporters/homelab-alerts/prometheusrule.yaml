# Early warnings for the failure that took k3s-prod down on 2026-10-31: a month
# of crash loops filled the node's disk, the kubelet started evicting pods, and
# ~600 dead pods piled up. The chart's default rules only fire at <5% free
# (NodeFilesystemAlmostOutOfSpace) — after the kubelet has already started
# evicting at 95% used — so these fire well before that.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-alerts
    app.kubernetes.io/part-of: homelab
spec:
  groups:
    - name: homelab-node-disk
      rules:
        - alert: HomelabNodeDiskFilling
          # job="node-exporter" = the cluster node itself, not the macOS exporter
          expr: |
            (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 0.80
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} root disk is {{ $value | humanizePercentage }} full"
            description: "Root filesystem on {{ $labels.instance }} has been over 80% for an hour. The kubelet starts evicting pods at 95%. Check for crash-looping pods, dead pods and unused images."
        - alert: HomelabNodeDiskCritical
          expr: |
            (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 0.90
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} root disk is {{ $value | humanizePercentage }} full — evictions imminent"
            description: "Root filesystem on {{ $labels.instance }} is over 90%. At 95% the kubelet evicts pods and blocks scheduling."
    - name: homelab-pods
      rules:
        - alert: HomelabFailedPodsPilingUp
          expr: sum(kube_pod_status_phase{phase="Failed"}) > 25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} failed/evicted pods in the cluster"
            description: "Terminated pods are accumulating, usually a sign of evictions (disk or memory pressure) or a crash-looping workload being replaced over and over. kubectl get pods -A --field-selector=status.phase=Failed"
    # Replaces NetAlertX (retired 2026-11-19). NetAlertX scanned by ARP from
    # k3s-prod, so it only ever saw the Default VLAN; UniFi Poller already gets
    # every client on every VLAN from the controller.
    - name: homelab-network
      rules:
        - alert: HomelabNewNetworkClient
          # A MAC that is connected now but was not seen at any point in the
          # previous 14 days (prod retention is 15d). The 15m offset makes the
          # alert fire once and resolve on its own once the new series is older
          # than the offset, so each new device is one notification, not a
          # standing alert. Devices that rotate their private Wi-Fi address
          # (iOS/Android "Rotating") will show up as new each time they rotate.
          expr: |
            group by (mac, name, ip, oui, network) (unpoller_client_uptime_seconds)
              unless on (mac)
            group by (mac) (last_over_time(unpoller_client_uptime_seconds[14d] offset 15m))
          labels:
            severity: warning
          annotations:
            summary: "New device on {{ $labels.network }}: {{ $labels.name }} ({{ $labels.mac }}, {{ $labels.ip }}, {{ $labels.oui }})"
            description: "A client not seen in the last 14 days joined the network. If you don't recognise it, find it in UniFi → Client Devices by MAC and block or move it."
    # Uptime checks from Gatus (base/infra/gatus). Each endpoint in its config
    # carries a "notify" label: critical (Pushover high priority, bypasses quiet
    # hours: things the whole house depends on), warning (normal), none (shown on
    # the status page only, e.g. the MacBook Pro's model servers, which sleep).
    # max by (name, group): one alert per endpoint, however many Gatus pods
    # have reported it.
    - name: homelab-uptime
      rules:
        - alert: HomelabEndpointDownCritical
          expr: max by (group, name) (gatus_results_endpoint_success{notify="critical"}) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.name }} is down"
            description: "Gatus has failed the {{ $labels.group }} check \"{{ $labels.name }}\" for 3 minutes. See https://uptime.sunnyside.home for the failing condition."
        - alert: HomelabEndpointDown
          expr: max by (group, name) (gatus_results_endpoint_success{notify="warning"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} is down"
            description: "Gatus has failed the {{ $labels.group }} check \"{{ $labels.name }}\" for 10 minutes. See https://uptime.sunnyside.home for the failing condition."
        - alert: HomelabUptimeChecksMissing
          # Gatus itself gone (pod down, or its metrics not scraped): without
          # this, every check above would go quiet rather than fire.
          expr: absent(gatus_results_endpoint_success)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Gatus uptime checks are not reporting"
            description: "No gatus_results_endpoint_success series for 15 minutes. Check the gatus pod in the infra namespace and its ServiceMonitor."
    # The daily brief (base/productivity/today): a run can fail, or never start,
    # without anything being "down" — the page still serves yesterday's brief.
    # Suspended CronJobs (staging) are ignored.
    - name: homelab-jobs
      rules:
        - alert: HomelabDailyBriefStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="productivity", cronjob="today"}) > 26 * 3600
              and on (namespace, cronjob) kube_cronjob_spec_suspend == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The daily brief has not completed in over 26 hours"
            description: "CronJob productivity/today last succeeded {{ $value | humanizeDuration }} ago. kubectl -n productivity get jobs; kubectl -n productivity logs job/<latest>"

