# nginx for the daily brief (replaces nginx-unprivileged's default.conf).
#
# The pages are rebuilt during the day (a re-extraction after a fix, a second
# run), but browsers kept serving their saved copy: on 2026-11-24 a refreshed
# article was on the server at 13:22 and the phone still showed the 07:05 page.
# "no-cache" means "check before using a saved copy": the browser sends its
# ETag, nginx answers 304 when nothing changed, so it costs a header, not a
# download. Images never change once written, so they may be kept for a day.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location ~ /$ {
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(jpe?g|png|webp|gif|avif)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}
