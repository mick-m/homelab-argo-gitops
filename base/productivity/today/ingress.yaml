apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: today
  namespace: productivity
  labels:
    app.kubernetes.io/name: today
    app.kubernetes.io/part-of: homelab
  annotations:
    cert-manager.io/cluster-issuer: stepca-acme
spec:
  ingressClassName: traefik
  rules:
    - host: today.sunnyside.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: today
                port:
                  number: 80
  tls:
    - hosts:
        - today.sunnyside.home
      secretName: today-tls
