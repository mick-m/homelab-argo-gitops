apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - cronjob.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  # Hash suffix on the name: an edit rolls the nginx pod (subPath mounts never
  # see ConfigMap updates). Never set disableNameSuffixHash.
  - name: today-nginx
    namespace: productivity
    files:
      - default.conf=config/default.conf
