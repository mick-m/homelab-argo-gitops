apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-gpt
  namespace: productivity
  labels:
    app.kubernetes.io/name: paperless-gpt
    app.kubernetes.io/part-of: homelab
  annotations:
    cert-manager.io/cluster-issuer: stepca-acme
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-gpt.sunnyside.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-gpt
                port:
                  number: 80
  tls:
    - hosts:
        - paperless-gpt.sunnyside.home
      secretName: paperless-gpt-tls
