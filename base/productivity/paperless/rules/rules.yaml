# Paperless rules managed in git (Mick, 2026-11-27). Applied to Paperless's
# database by the paperless-rules Job on every Argo CD sync of productivity,
# on staging and prod alike.
#
# - Things are matched BY NAME. Listed ones are created or updated to match this
#   file; anything not listed (one-off correspondents, tags added in the UI) is
#   left alone. So change these rules HERE, not in the UI: the next sync puts
#   the git version back.
# - Which document has which correspondent/type/tag is data and stays in
#   Paperless (and in the nightly export), not here.
#
# matching: none | any | all | exact | regex | fuzzy | auto
#   auto = Paperless learns from documents already filed that way.
#   Trigger tags for other tools must be "none": an "auto" tag can be put on new
#   documents by Paperless's classifier (how paperless-gpt kept firing).

document_types:
  - {name: Bill, matching: none}            # set by the workflows below
  - {name: Invoice, matching: auto}
  - {name: Quote, matching: auto}
  - {name: Payslip, matching: regex, match: "pay ?slip"}
  - {name: Contract, matching: auto}
  - {name: Employment letter, matching: auto}
  - {name: Certificate, matching: auto}
  - {name: Reference, matching: auto}
  - {name: Lease / Tenancy, matching: auto}
  - {name: Report / Plans, matching: auto}
  - {name: Correspondence, matching: auto}
  - {name: ID document, matching: none}
  - {name: Bank statement, matching: none}  # set by the AIB and Revolut workflows
  - {name: Tax document, matching: none}    # set by the Revenue workflow

tags:
  - {name: Sunnyside, matching: auto}
  - {name: Employment, matching: auto}
  - {name: Education, matching: auto}
  - {name: Rental history, matching: auto}
  - {name: Utilities, matching: none}       # set by the workflows below

# Custom fields: figures to sort, filter and total by. post_consume.py fills them
# for the recurring bills (Flogas, Pure Telecom, Oxigen) and Workday payslips;
# one-off documents were filled once. Monetary values are euro.
custom_fields:
  - {name: Amount, type: monetary}                 # total of a bill, invoice or quote, incl VAT
  - {name: kWh, type: integer}                     # energy used (gas or electricity)
  - {name: Unit rate (c/kWh), type: float}         # energy only; weighted if the rate changed
  - {name: Gross pay, type: monetary}              # payslips: this period
  - {name: Net pay, type: monetary}
  - {name: On-call pay, type: monetary}            # Workday payslips; 0 when there is no line
  - {name: Tax balance, type: monetary}            # Statement of Liability: + refund, - owed

# Regular senders only: their matching rule. One-off correspondents stay in the UI.
correspondents:
  # Set by the statement workflows, not by matching: other documents mention them.
  - {name: AIB, matching: none}
  - {name: Revolut, matching: none}
  - {name: Revenue, matching: none}
  - {name: Oxigen, matching: none}
  - {name: Flogas, matching: exact, match: Flogas}
  - {name: Pure Telecom, matching: regex, match: "Pure Telecom|SIBT00007644"}
  - {name: Workday, matching: exact, match: Workday}
  - {name: Shields Construction, matching: exact, match: Shields Construction}
  - {name: Paddy Power Betfair, matching: regex, match: "Paddy Power|Power Leisure Bookmakers|Betfair"}

# Titles for recurring documents, set when a document is added. Paperless 3.4
# fills titles with Jinja: placeholders need DOUBLE braces, {{ created_year }}.
# Single braces come out literally (2026-11-27).
# Flogas titles are finished by post_consume.py, which runs after these and adds
# the issue date from the file name and the billing period from the bill's text.
#
# Order matters: workflows run in order and each sees the previous one's changes
# (3.4.1 refreshes the document between workflows). Bank statements mention
# Flogas and Pure Telecom (direct debits), so the sender rules match them; the
# AIB workflow runs first and sets the correspondent to AIB, after which the bill
# workflows no longer match. Without it, statements became "Pure Telecom Bill"s
# (2026-11-27).
workflows:
  - name: "Title: AIB statement"
    order: 1
    when: {content: "Statement of Account with Allied Irish Banks"}
    set: {title: "AIB Statement {{ created_year }}-{{ created_month }}", correspondent: AIB, document_type: Bank statement}
  # Revolut's export: account-statement_<from>_<to>_<lang>_<id>.pdf. Both the file
  # name and "Revolut Ltd" in the text, so an AIB statement listing a transfer to
  # Revolut does not match.
  - name: "Title: Revolut statement"
    order: 2
    when: {filename: "account-statement_*", content: "Revolut Ltd"}
    set: {title: "Revolut Statement {{ created_year }}-{{ created_month }}", correspondent: Revolut, document_type: Bank statement}
  # Revenue's downloads are <Kind>_<Year>_<Number>.pdf (Tax_Credit_Certificate_2021_…,
  # Statement_of_Liability_2009_…, LPT_Payment_Method_Reminder_2027_…). Both that
  # file name and Revenue wording: older letters have "Revenue" only in the logo,
  # but every one opens "In all correspondence please quote". Before Workday's rule
  # matters: tax credit certificates name the employer (2026-11-27).
  - name: "Title: Revenue document"
    order: 3
    when: {filename: "*_[12][0-9][0-9][0-9]_[0-9]*", content_regex: "Revenue|PAYE Services|LPT Branch|In all correspondence please quote"}
    set: {title: "Revenue document {{ created_year }}", correspondent: Revenue, document_type: Tax document}
  # Oxigen (waste) payment requests: MICHAEL_MCCARTHY_Invoice-<n>-<k>.pdf, the
  # invoice is an image on the page (needs PAPERLESS_OCR_MODE=redo), plus a text
  # bin calendar. The company's legal name AND the file name: AIB statements list
  # Oxigen direct debits.
  - name: "Title: Oxigen bill"
    order: 4
    when: {filename: "*_Invoice-*", content: "Oxigen Environmental ULC"}
    set: {title: "Oxigen Bill {{ created_year }}-{{ created_month }}", correspondent: Oxigen, document_type: Bill, tags: [Utilities]}
  - name: "Title: Flogas gas bill"
    order: 10
    when: {correspondent: Flogas, filename: "FGNG*"}
    set: {title: "Flogas Gas Bill {{ created_year }}-{{ created_month }}", document_type: Bill, tags: [Utilities]}
  - name: "Title: Flogas electricity bill"
    order: 11
    when: {correspondent: Flogas, filename: "*InvoiceElec*"}
    set: {title: "Flogas Electricity Bill {{ created_year }}-{{ created_month }}", document_type: Bill, tags: [Utilities]}
  - name: "Title: Pure Telecom bill"
    order: 12
    when: {correspondent: Pure Telecom}
    set: {title: "Pure Telecom Bill {{ created_year }}-{{ created_month }}", document_type: Bill, tags: [Utilities]}
  - name: "Title: payslip"
    order: 20
    when: {document_type: Payslip}
    set: {title: "{{ correspondent }} Payslip {{ created_year }}-{{ created_month }}"}
