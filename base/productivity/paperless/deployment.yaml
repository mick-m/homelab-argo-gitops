apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: productivity
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/part-of: homelab
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Dublin
            - name: PAPERLESS_REDIS
              value: redis://localhost:6379
            - name: PAPERLESS_DBHOST
              value: paperless-db
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              value: paperless-k3s-2026
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng
            - name: PAPERLESS_URL
              value: https://paperless.sunnyside.home
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Dublin
            - name: PAPERLESS_CONSUMER_POLLING
              value: "30"
            # Required by recent Paperless releases (refuses to start without it).
            # The Secret is created per cluster, out of band (not in git yet):
            #   kubectl -n productivity create secret generic paperless-secret-key \
            #     --from-literal=PAPERLESS_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret-key
                  key: PAPERLESS_SECRET_KEY
            # Run as the TrueNAS user mickm (UID/GID 3000), not the image's 1000.
            # On every start the image chowns consume/ (and data, media) to its
            # own user; consume/ is on the NAS and is also the SMB share Mick
            # drops scans into from his Mac as mickm. As 1000 it took the folder
            # from mickm and his Mac could no longer write to it (2026-11-27).
            # Kept last: staging overlays patch env lists by position.
            - name: USERMAP_UID
              value: "3000"
            - name: USERMAP_GID
              value: "3000"
            # OCR threads. Paperless defaults to one per CPU it sees (8 on k3s-prod)
            # and ran 8 page OCRs at once, past the 2Gi limit: OOMKilled four times
            # in 18 minutes while importing, the UI down each time, and every
            # restart retried the same files (2026-11-27). 2 matches the CPU limit.
            # Kept last: staging overlays patch env lists by position.
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            # Runs after each import, after the workflows: finishes Flogas bill
            # titles and dates (rules/post_consume.py). Kept last (see above).
            - name: PAPERLESS_POST_CONSUME_SCRIPT
              value: /usr/src/paperless/scripts/post_consume.sh
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi   # headroom for a large scan even at 2 OCR threads
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
              subPath: consume
            - name: scripts
              mountPath: /usr/src/paperless/scripts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          nfs:
            server: 192.168.1.202
            path: /mnt/volume1/documents/paperless
        - name: scripts
          configMap:
            name: paperless-rules
            defaultMode: 0755
