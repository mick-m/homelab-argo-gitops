# SearXNG settings, rendered into a ConfigMap (see kustomization.yaml) and mounted
# over /etc/searxng/settings.yml in both clusters. Only overrides live here:
# everything else comes from the defaults shipped in the image.
#
# The secret key is NOT here: it comes from the searxng-secret Secret via
# SEARXNG_SECRET (created by hand in each cluster, not in git).
#
# Engine choices are based on this instance's own /stats and /stats/errors
# (prod, 2026-11-22, residential IP). Re-check those before changing them:
#   kubectl -n productivity exec deploy/searxng -c searxng -- wget -qO- http://127.0.0.1:8080/stats/errors
use_default_settings: true

general:
  instance_name: "Sunnyside Search"

search:
  # Vane and Open WebUI use the JSON API.
  formats:
    - html
    - json
  # Off: autocomplete would send every keystroke to the provider.
  autocomplete: ""
  default_lang: "en-IE"
  suspended_times:
    SearxEngineTooManyRequests: 600

server:
  # Private instance: the limiter is for public ones and would throttle Vane.
  limiter: false
  public_instance: false
  # POST keeps search terms out of URLs, browser history and logs.
  method: "POST"
  # Result images load through SearXNG, not directly from each site.
  image_proxy: true

ui:
  query_in_title: false

outgoing:
  request_timeout: 4.0

engines:
  # 100% HTTP 403 from this IP.
  - name: google
    disabled: true
  - name: google images
    disabled: true
  - name: wikidata
    disabled: true
  # 100% CAPTCHA from this IP.
  - name: startpage
    disabled: true
  # Off upstream, but bing news/images are 100% reliable from here: second web source.
  - name: bing
    disabled: false
  # Off since Brave's 2026-11-11 change: result links are now encrypted
  # search.brave.com/go/v1#... redirects that only a browser can decrypt, so
  # SearXNG returns them as broken "http:///go/v1/..." URLs. Re-check after
  # upstream SearXNG updates (was weight 1.5, our best web source).
  - name: brave
    disabled: true
  # 100% reliable.
  - name: wikipedia
    weight: 1.5
  # ~55% CAPTCHA on 2026.10.30; upstream's fix (PR #6946) arrives with a newer image.
  - name: duckduckgo
    weight: 1
  # Adds unrelated stories to news results (old articles matching one word).
  - name: wikinews
    disabled: true

# Boost Irish and tech sources, like Google News does for local outlets.
# Matches whole hostnames (no per-section boosts, so BBC NI and Guardian
# Ireland are left out). Kept in step with ~/workspace/daily_aggregator/feeds.txt.
# Irish Examiner left out on purpose: its paywall leaves stubs (aggregator
# dropped it 2026-09-20). The hostnames plugin is on by default.
hostnames:
  high_priority:
    # Irish
    - '(.*\.)?rte\.ie$'
    - '(.*\.)?irishtimes\.com$'
    - '(.*\.)?thejournal\.ie$'
    - '(.*\.)?breakingnews\.ie$'
    - '(.*\.)?newstalk\.com$'
    - '(.*\.)?joe\.ie$'
    - '(.*\.)?irishmirror\.ie$'
    - '(.*\.)?thesun\.ie$'
    - '(.*\.)?independent\.ie$'
    - '(.*\.)?businesspost\.ie$'
    - '(.*\.)?siliconrepublic\.com$'
    - '.*\.ie$'
    # Paywalled, but Mick subscribes (Vane fetches without a login, so it
    # may only see teasers from these)
    - '(.*\.)?ft\.com$'
    - '(.*\.)?nytimes\.com$'
    # Tech
    - '(.*\.)?arstechnica\.com$'
    - '(.*\.)?theverge\.com$'
    - '(.*\.)?techcrunch\.com$'
    - '(.*\.)?theregister\.com$'
    - '(.*\.)?simonwillison\.net$'
    - '(.*\.)?bleepingcomputer\.com$'
    - '(.*\.)?infoworld\.com$'
    - '(.*\.)?engadget\.com$'
    - '(.*\.)?wired\.com$'
    - '^news\.ycombinator\.com$'
