apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# settings.yml is mounted with subPath, and Kubernetes never propagates ConfigMap
# updates into a subPath mount. The generated ConfigMap gets a content-hash name
# suffix, so editing settings.yml changes the name, changes the Deployment's
# volume reference and rolls the pod (same pattern as homepage).
# Do not set disableNameSuffixHash.
namespace: productivity

configMapGenerator:
  - name: searxng-config
    files:
      - settings.yml

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
