apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  namespace: infra
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: homelab
  annotations:
    cert-manager.io/cluster-issuer: stepca-acme
spec:
  ingressClassName: traefik
  rules:
    - host: gatus.sunnyside.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 80
  tls:
    - hosts:
        - gatus.sunnyside.home
      secretName: gatus-tls
