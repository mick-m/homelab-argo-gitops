apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
configMapGenerator:
  # Hash suffixes: an edit to either file rolls the pod. Never set
  # disableNameSuffixHash.
  - name: gatus-config
    namespace: infra
    files:
      - config.yaml=config/config.yaml
  - name: gatus-stepca-root
    namespace: infra
    files:
      - stepca-root.pem=config/stepca-root.pem
