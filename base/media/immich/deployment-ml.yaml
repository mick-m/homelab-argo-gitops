# Immich machine learning: face recognition and smart search. CPU only.
# Memory spikes while indexing a large library; models are cached in /cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: media
  labels:
    app.kubernetes.io/name: immich-ml
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-ml
        app.kubernetes.io/part-of: homelab
    spec:
      # A Service named "immich" makes Kubernetes inject IMMICH_PORT=tcp://...
      # into every pod in the namespace, which Immich reads as its own port and
      # crashes on. DNS is used for discovery, so the injected vars aren't needed.
      enableServiceLinks: false
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.0
          ports:
            - containerPort: 3003
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Dublin
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
