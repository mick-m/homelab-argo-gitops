# Immich server (web UI + API + background jobs). Prod storage, all on the NAS:
#   /data        -> 192.168.1.202:/mnt/volume1/immich  (read-write, prod only;
#                   staging patches this to its own PVC)
#   /mnt/photos  -> 192.168.1.202:/mnt/volume1/photos  (read-only; add it in
#                   Administration > External Libraries with import path /mnt/photos)
# Server, ML and DB must stay on the same Immich release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: media
  labels:
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/part-of: homelab
    spec:
      # A Service named "immich" makes Kubernetes inject IMMICH_PORT=tcp://...
      # into every pod in the namespace, which Immich reads as its own port and
      # crashes on. DNS is used for discovery, so the injected vars aren't needed.
      enableServiceLinks: false
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.0
          ports:
            - containerPort: 2283
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Dublin
            - name: DB_HOSTNAME
              value: immich-db
            - name: DB_USERNAME
              value: immich
            - name: DB_PASSWORD
              value: immichk3s2026
            - name: DB_DATABASE_NAME
              value: immich
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-ml:3003
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: library
              mountPath: /data
            - name: photos
              mountPath: /mnt/photos
              readOnly: true
      volumes:
        - name: library
          nfs:
            server: 192.168.1.202
            path: /mnt/volume1/immich
        - name: photos
          nfs:
            server: 192.168.1.202
            path: /mnt/volume1/photos
            readOnly: true
