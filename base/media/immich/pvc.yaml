apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-data
  namespace: media
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: media
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
