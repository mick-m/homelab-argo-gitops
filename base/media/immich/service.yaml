apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: media
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - port: 80
      protocol: TCP
      targetPort: 2283
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: media
  labels:
    app.kubernetes.io/name: immich-ml
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-ml
  ports:
    - port: 3003
      protocol: TCP
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: immich-db
  namespace: media
  labels:
    app.kubernetes.io/name: immich-db
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-db
  ports:
    - port: 5432
      protocol: TCP
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: media
  labels:
    app.kubernetes.io/name: immich-valkey
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-valkey
  ports:
    - port: 6379
      protocol: TCP
      targetPort: 6379
