apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/productivity

patches:
  - target:
      kind: Ingress
      name: freshrss
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-rss.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-rss.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-freshrss-tls

  - target:
      kind: Ingress
      name: mealie
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-mealie.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-mealie.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-mealie-tls

  - target:
      kind: Ingress
      name: searxng
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-search.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-search.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-searxng-tls

  - target:
      kind: Ingress
      name: nextcloud
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-cloud.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-cloud.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-nextcloud-tls

  - target:
      kind: Deployment
      name: nextcloud
    patch: |
      - op: replace
        path: /spec/template/spec/containers/1/env/9/value
        value: staging-cloud.sunnyside.home
      - op: replace
        path: /spec/template/spec/containers/1/env/11/value
        value: https://staging-cloud.sunnyside.home

  - target:
      kind: Ingress
      name: paperless-gpt
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-paperless-gpt.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-paperless-gpt.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-paperless-gpt-tls

  # Links from paperless-gpt back to staging Paperless. Strategic merge, matched
  # by env var name, so the variable's position does not matter.
  - target:
      kind: Deployment
      name: paperless-gpt
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperless-gpt
      spec:
        template:
          spec:
            containers:
              - name: paperless-gpt
                env:
                  - name: PAPERLESS_PUBLIC_URL
                    value: https://staging-paperless.sunnyside.home

  # The nightly Paperless export writes to the NAS (documents/paperless/export);
  # only prod's archive belongs there.
  - target:
      kind: CronJob
      name: paperless-export
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: paperless-export

  # Staging Paperless must not import from the NAS consume folder: it shares it with
  # prod, and whichever cluster polls first imports a scan and deletes it, so some
  # of Mick's scans ended up in staging instead of his real archive (2026-11-27).
  # Swap the NFS volume for an empty pod-local folder; staging still starts and
  # can be tested by uploading through its UI. Strategic merge, matched by volume
  # name, so the volume's position in the list does not matter.
  - target:
      kind: Deployment
      name: paperless
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperless
      spec:
        template:
          spec:
            volumes:
              - name: consume
                nfs: null
                emptyDir: {}
            # Paperless (Django) accepts logins and forms only from PAPERLESS_URL;
            # with prod's URL every staging form failed CSRF verification.
            containers:
              - name: paperless
                env:
                  - name: PAPERLESS_URL
                    value: https://staging-paperless.sunnyside.home

  - target:
      kind: Ingress
      name: paperless
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-paperless.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-paperless.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-paperless-tls

  - target:
      kind: Ingress
      name: today
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-today.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-today.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-today-tls

  # Installed but paused on staging: run it by hand to test
  # (kubectl -n productivity create job --from=cronjob/today today-test).
  - target:
      kind: CronJob
      name: today
    patch: |
      - op: add
        path: /spec/suspend
        value: true
