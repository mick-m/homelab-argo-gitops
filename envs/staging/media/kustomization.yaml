apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/media

patches:
  - target:
      kind: Ingress
      name: plex
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-plex.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-plex.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-plex-tls

  - target:
      kind: Ingress
      name: tautulli
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-tautulli.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-tautulli.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-tautulli-tls

  - target:
      kind: Ingress
      name: tunarr
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-tunarr.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-tunarr.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-tunarr-tls

  - target:
      kind: Ingress
      name: metube
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-metube.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-metube.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-metube-tls

