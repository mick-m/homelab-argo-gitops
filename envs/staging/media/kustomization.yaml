apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/media
  - immich-library-pvc.yaml

patches:
  - target:
      kind: Ingress
      name: plex
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-plex.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-plex.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-plex-tls

  - target:
      kind: Ingress
      name: tautulli
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-tautulli.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-tautulli.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-tautulli-tls

  - target:
      kind: Ingress
      name: metube
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-metube.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-metube.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-metube-tls

  - target:
      kind: Ingress
      name: immich
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-immich.sunnyside.home
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-immich.sunnyside.home
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-immich-tls

  # Swap the prod NAS library (/mnt/volume1/immich, not exported to staging) for
  # the staging PVC. Strategic merge matches the volume by name, not position.
  - target:
      kind: Deployment
      name: immich-server
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: immich-server
        namespace: media
      spec:
        template:
          spec:
            volumes:
              - name: library
                nfs: null
                persistentVolumeClaim:
                  claimName: immich-library
